services:
  - type: web
    name: christmas-gift-factory
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUDIT_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
